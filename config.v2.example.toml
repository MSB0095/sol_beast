# SOL BEAST 2.0 example configuration with zero-cost RPC role routing.
#
# Copy to config.toml and put the keys in secrets.toml (mode 0600):
#   helius_api_key = "..."
#   alchemy_api_key = "..."
# `beast init` writes this same keyless structure; this file is the tracked
# example that shows the recommended free-tier split explicitly.
#
# The public endpoint carries the high-volume feed. Helius handles execution,
# discovery and rent because its free tier enables the heavy methods. Alchemy
# is the fallback. dRPC free does not serve Solana at all.
config_version = 2

[runtime]
mode = "radar"            # off | radar | canary | live
real = false              # live sending also requires the --real CLI flag
require_cli_real = true
data_dir = "./data"

[wallet]
keypair_path = "./keypair.json"
cold_address = ""
require_0600 = true

[rpc]
urls = ["https://api.mainnet-beta.solana.com"]
ws_urls = ["wss://api.mainnet-beta.solana.com/"]
commitment = "confirmed"
timeout_ms = 5000
max_retries = 2
circuit_breaker_seconds = 15
jupiter_quote_url = "https://lite-api.jup.ag/swap/v1"
jupiter_swap_instructions_url = "https://lite-api.jup.ag/swap/v1"

# Role routing: a method first uses a matching-role endpoint with the lowest
# priority number, then a fallback endpoint, then any healthy endpoint.
# monthly_call_budget is process-local accounting, reset after 30 days of
# uptime or a restart; keep it below the provider's real quota.
[[rpc.endpoints]]
name = "helius-exec"
url = "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
role = "exec"
max_rps = 8
heavy_rps = 4
monthly_call_budget = 300000
priority = 1

[[rpc.endpoints]]
name = "helius-discovery"
url = "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
role = "discovery"
max_rps = 5
heavy_rps = 4
monthly_call_budget = 300000
priority = 1

[[rpc.endpoints]]
name = "helius-rent"
url = "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
role = "rent"
max_rps = 5
heavy_rps = 4
monthly_call_budget = 100000
priority = 1

[[rpc.endpoints]]
name = "alchemy-fallback"
url = "https://solana-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
role = "fallback"
max_rps = 12
heavy_rps = 4
monthly_call_budget = 900000
priority = 10

[[rpc.endpoints]]
name = "public-feed"
url = "https://api.mainnet-beta.solana.com"
role = "feed"
max_rps = 3
heavy_rps = 1
monthly_call_budget = 0
priority = 10

[[rpc.endpoints]]
name = "public-fallback"
url = "https://api.mainnet-beta.solana.com"
role = "fallback"
max_rps = 3
heavy_rps = 1
monthly_call_budget = 0
priority = 20

[jito]
enabled = false
block_engine_urls = [
  "https://amsterdam.mainnet.block-engine.jito.wtf",
  "https://frankfurt.mainnet.block-engine.jito.wtf",
  "https://london.mainnet.block-engine.jito.wtf",
  "https://ny.mainnet.block-engine.jito.wtf",
  "https://slc.mainnet.block-engine.jito.wtf",
  "https://singapore.mainnet.block-engine.jito.wtf",
  "https://tokyo.mainnet.block-engine.jito.wtf",
]
tip_floor_url = "https://bundles.jito.wtf/api/v1/bundles/tip_floor"
tip_accounts = []
tip_percentile = 75
send_regions = 2
requests_per_second = 1
leader_window = 2
bundle_only = true

[risk]
balance_floor_lamports = 50_000_000
max_inflight_bundles = 6
max_inflight_per_strategy = 3
max_attempts_per_min = 60
daily_landed_cost_cap_lamports = 100_000_000
max_model_error_bps = 50
max_feed_lag_ms = 2000
max_slot_lag = 3
max_clock_skew_ms = 250
max_consecutive_failures = 25
unexpected_balance_delta_lamports = 1000
kill_switch_file = "./STOP"

[api]
enabled = true
bind = "127.0.0.1:8081"
allow_remote = false
allowed_origins = []
rate_limit_per_sec = 20
read_rate_limit_per_sec = 60
body_limit_bytes = 65536
# Serve a built frontend from the API (single process, no Vite dev server).
# static_dir = "frontend/dist"

[storage]
path = "./data/beast.sqlite3"
retention_days = 30
feed_retention_days = 7

[log]
level = "info"
json = false

[guard]
enabled = true
mode = "lite"             # lite (last-leg min-out) | program (on-chain assertion)
program_id = ""
min_profit_lamports = 10_000

[venues]
disabled = []
quote_only = []
jupiter_quote_url = "https://lite-api.jup.ag/swap/v1"
jupiter_swap_instructions_url = "https://lite-api.jup.ag/swap/v1"
max_accounts = 48
restrict_intermediate_tokens = true

[flash]
# `kamino`, `solend` and `marginfi` are verified by mainnet borrow → repay
# simulations. Enabled here with an empty mint so the engine loads the deepest
# active reserve per mint; set a mint to restrict discovery.
enabled = true
provider = "kamino"
mint = ""
max_borrow_lamports = 1000000000
reserve = ""
# Maximum adverse decay between the radar quote and the executor's fresh
# quote. Local CPMM swaps are exact-in; this does not relax on-chain minimums.
slippage_bps = 20
# Address lookup table for cycles that exceed the 1232-byte transaction limit.
# Create it with `beast flash-alt`, then paste the address it prints. Its rent
# is recovered with `beast flash-alt-close --table <address>`.
# Marginfi + two CPMM swaps needs one (1177 bytes with, 1326 without).
# Kamino and Solend cycles fit without a table; leave this empty for them.
lookup_table = ""

[rent]
enabled = true
batch_size = 20
include_token_2022 = true
dust_burn = false
dust_threshold_usd = 1.0
min_recovered_lamports = 10_000

[strategies.cross_dex_arb]
mode = "radar"
min_net_lamports = 20_000
max_notional_lamports = 50_000_000_000
max_price_impact_bps = 80
tip_alpha_initial = 0.5
tip_cap_lamports = 2_000_000
max_attempts_per_min = 30
daily_cost_cap_lamports = 50_000_000
max_inflight = 2
ttl_slots = 2
start_mints = ["So11111111111111111111111111111111111111112"]
venues = []
pair_allowlist = []
pair_denylist = []

