[strategies.flash_arb]
# Radar proves detection and the reserve route without spending. Arm live only
# after a funded wallet, Jito access and the guard are in place.
mode = "radar"
min_net_lamports = 20000
max_notional_lamports = 1000000000
max_price_impact_bps = 80
tip_alpha_initial = 0.5
tip_cap_lamports = 2000000
max_attempts_per_min = 15
daily_cost_cap_lamports = 20000000
max_inflight = 1
ttl_slots = 2
# Empty: the router indexes every pool mint so any Kamino reserve can fund a
# cycle. Set [flash] mint to restrict discovery to one asset.
start_mints = []
venues = []
pair_allowlist = []
pair_denylist = []
